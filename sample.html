<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>iframeでWEBサイト表示</title>
  <style>
    /* ページ全体をiframeが占めるように調整 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe src="https://x.com/"></iframe>
</body>
</html>
