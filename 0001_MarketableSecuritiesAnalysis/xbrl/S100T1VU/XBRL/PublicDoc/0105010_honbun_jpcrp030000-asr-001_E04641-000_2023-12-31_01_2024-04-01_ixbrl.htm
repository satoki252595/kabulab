<h2>第５【経理の状況】</h2>
<p style="margin-left: 14px; line-height: 21px; text-align: left">
<span style="font-family: 'ＭＳ ゴシック'; font-size: 14px">１　財務諸表の作成方法について</span>
</p>
<p style="margin-left: 42px; text-align: left">
<ix:nonNumeric name="jpcrp_cor:RegulationsInAccordanceWithWhichFinancialStatementsHaveBeenPreparedFinancialInformation" contextRef="CurrentYearDuration" escape="false">当社の財務諸表は「財務諸表等の用語、様式及び作成方法に関する規則」（昭和38年大蔵省令第59号）に基づいて作成している。</ix:nonNumeric>
</p>
<p style="margin-left: 14px; line-height: 21px; text-align: left">
<span style="font-family: 'ＭＳ ゴシック'; font-size: 14px">２　監査証明について</span>
</p>
<p style="margin-left: 42px; text-align: left">
<ix:nonNumeric name="jpcrp_cor:NoteOnIndependentAuditFinancialInformation" contextRef="CurrentYearDuration" escape="false">当社は、金融商品取引法第193条の２第１項の規定に基づき、第65期事業年度（令和５年１月１日から令和５年12月31日まで）の財務諸表について、公認会計士　古村光洋の監査を受けている。</ix:nonNumeric>
</p>
<p style="text-align: left">&#160;</p>
<p style="margin-left: 14px; line-height: 21px; text-align: left">
<span style="font-family: 'ＭＳ ゴシック'; font-size: 14px">３　連結財務諸表について</span>
</p>
<p style="margin-left: 42px; text-align: left">
<ix:nonNumeric name="jpcrp_cor:DescriptionOfFactThatConsolidatedFinancialStatementsHaveNotBeenPreparedFinancialInformation" contextRef="CurrentYearDuration" escape="false">当社は、子会社がないため、連結財務諸表は作成していない。</ix:nonNumeric>
</p>
<p style="text-align: left">&#160;</p>
</div>
